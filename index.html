<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recomp</title>
  <meta name="description" content="Workout planner and cut tracker: a training split for however many days you have, a full exercise library, and a log for workouts, calories and weight.">
  <meta name="theme-color" content="#16202C">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* Apply a saved light/dark choice before first paint */
    (function () {
      try {
        var d = JSON.parse(localStorage.getItem('recomp:data:v1') || '{}');
        var t = d && d.settings && d.settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#view" onclick="document.getElementById('view').focus(); return false;">Skip to content</a>
  <div class="shell">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="#dashboard" aria-label="Recomp, overview">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1B5FC1"/><circle cx="16" cy="16" r="10.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><circle cx="16" cy="16" r="3.6" fill="#E9ECEF"/></svg>
        <span>Recomp</span>
      </a>
      <ul>
        <li><a class="nav-link" href="#dashboard" data-route="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 17 4-5"/></svg><span>Overview</span></a></li>
        <li><a class="nav-link" href="#plan" data-route="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5h6v3H9zM9 11h6M9 15h4"/></svg><span>Plan</span></a></li>
        <li><a class="nav-link" href="#exercises" data-route="exercises"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h2M20 12h2M8 12h8"/><rect x="4" y="7" width="4" height="10" rx="1"/><rect x="16" y="7" width="4" height="10" rx="1"/></svg><span>Exercises</span></a></li>
        <li><a class="nav-link" href="#log" data-route="log"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Log</span></a></li>
        <li><a class="nav-link" href="#weight" data-route="weight"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 11a3.5 3.5 0 0 1 7 0"/><path d="m12 11 1.6-2.2"/></svg><span>Weight</span></a></li>
        <li><a class="nav-link" href="#settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></a></li>
      </ul>
      <p class="nav-foot">Your data stays in this browser.</p>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">Recomp needs JavaScript to run.</p></noscript>

  <script src="js/util.js"></script>
  <script src="js/data/exercises.js"></script>
  <script src="js/data/foods.js"></script>
  <script src="js/data/programs.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/plan.js"></script>
  <script src="js/views/exercises.js"></script>
  <script src="js/views/log.js"></script>
  <script src="js/views/weight.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
